name: Build Docker image artifact

on:
  push:
    branches:
      - main
      - codex/dev

env:
  IMAGE_NAME: weii-new-api
  IMAGE_VERSION: v1.1.4

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set image version
        id: version
        run: |
          VERSION="${IMAGE_VERSION}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::IMAGE_VERSION must use the vX.X.X format"
            exit 1
          fi
          echo "$VERSION" > VERSION
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image artifact
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}-${{ matrix.arch }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ steps.version.outputs.value }}-${{ matrix.arch }}-docker
          path: /tmp/${{ env.IMAGE_NAME }}-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        run: |
          echo "### Docker image artifact (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "tag: ${IMAGE_NAME}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "platform: ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact: ${IMAGE_NAME}-${VERSION}-${{ matrix.arch }}-docker" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
